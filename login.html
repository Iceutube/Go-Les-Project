<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4 relative">

    <a href="index.html" class="absolute top-6 left-6 flex items-center gap-2 text-slate-600 hover:text-sky-600 font-bold text-xs bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm transition">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
    </a>

    <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-xl p-8 space-y-6 mt-12 sm:mt-0">
        <div class="text-center">
            <div class="bg-sky-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold mx-auto mb-3 text-xl shadow-md">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Masuk ke GO-LES</h1>
            <p class="text-xs text-slate-500 mt-1">Masukkan email dan password akun kamu</p>
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block font-semibold text-xs text-slate-700 mb-1">Email</label>
                <input type="email" id="login-email" required placeholder="nama@email.com" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="block font-semibold text-xs text-slate-700 mb-1">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-sky-500">
            </div>

            <button type="submit" id="btn-login" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">
                Masuk
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 space-y-2 pt-2 border-t border-slate-100">
            <p>Belum punya akun? <a href="register-siswa.html" class="text-sky-600 font-bold hover:underline">Daftar sebagai Siswa</a></p>
            <p>Atau ingin mengajar? <a href="register-tutor.html" class="text-sky-600 font-bold hover:underline">Daftar sebagai Tutor</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
       document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btnLogin = document.getElementById('btn-login');
    btnLogin.innerText = 'Memproses...';
    btnLogin.disabled = true;

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    // 1. Authenticate via Supabase Auth
    const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (authError) {
        alert('Gagal masuk: ' + authError.message);
        btnLogin.innerText = 'Masuk';
        btnLogin.disabled = false;
        return;
    }

    if (authData.user) {
        if (profiles && profiles.length > 0) {
            const userProfile = profiles[0];

            if (userProfile.role === 'admin') {
                window.location.href = 'admin.html';
            } else if (userProfile.role === 'tutor') {
                window.location.href = 'dashboard-tutor.html';
            } else {
                window.location.href = 'dashboard-siswa.html';
            }
        } else {
            // Default fallback jika profil tabel belum terbuat
            window.location.href = 'dashboard-siswa.html';
        }
    }
});
    </script>
</body>
</html>
