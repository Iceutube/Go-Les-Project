<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Tutor - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 max-w-lg w-full space-y-6 shadow-2xl relative overflow-hidden my-8">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-sm">
                <i class="fa-solid fa-chalkboard-user"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Gabung Sebagai Tutor GO-LES</h1>
            <p class="text-xs text-slate-500">Isi formulir pendaftaran untuk mulai mengajar siswa privat</p>
        </div>

        <form id="form-register-tutor" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap & Gelar <span class="text-rose-500">*</span></label>
                <input type="text" id="reg-name" required placeholder="Contoh: Budi Santoso, S.Pd." class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email <span class="text-rose-500">*</span></label>
                    <input type="email" id="reg-email" required placeholder="tutor@gmail.com" class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Password <span class="text-rose-500">*</span></label>
                    <input type="password" id="reg-password" required placeholder="••••••••" class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran Utama <span class="text-rose-500">*</span></label>
                    <select id="reg-subject" required class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50 font-medium">
                        <option value="Matematika">Matematika</option>
                        <option value="B. Indonesia">B. Indonesia</option>
                        <option value="B. Inggris">B. Inggris</option>
                        <option value="Fisika">Fisika</option>
                        <option value="Kimia">Kimia</option>
                        <option value="Biologi">Biologi</option>
                        <option value="Sosiologi">Sosiologi</option>
                        <option value="Sejarah">Sejarah</option>
                        <option value="Pancasila">Pancasila</option>
                        <option value="Geografi">Geografi</option>
                        <option value="Informatika">Informatika</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tingkat Sekolah Target <span class="text-rose-500">*</span></label>
                    <select id="reg-level" required class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50 font-medium">
                        <option value="SD">SD</option>
                        <option value="SMP">SMP</option>
                        <option value="SMA">SMA</option>
                        <option value="Umum">Umum</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Kota / Domisili <span class="text-rose-500">*</span></label>
                    <input type="text" id="reg-location" required placeholder="Contoh: Surabaya" class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nomor WhatsApp <span class="text-rose-500">*</span></label>
                    <input type="tel" id="reg-phone" required placeholder="08123456789" class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Tarif Sesi Per Jam (Rp) <span class="text-rose-500">*</span></label>
                <input type="number" id="reg-price" required min="0" placeholder="Contoh: 50000" class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
            </div>

            <button type="submit" id="btn-submit-register" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-sky-600/20">
                Daftar Sebagai Tutor
            </button>
        </form>

        <div class="text-center pt-2">
            <p class="text-xs text-slate-500">Sudah punya akun? <a href="login.html" class="text-sky-600 font-bold hover:underline">Masuk disini</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/register-tutor.js"></script>
</body>
</html>
