<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar sebagai Tutor - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-200/80 space-y-6">
        
        <div class="text-center space-y-2">
            <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-sky-600 transition mb-2">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
            </a>
            <div class="bg-sky-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold mx-auto text-xl shadow-lg shadow-sky-600/20">
                <i class="fa-solid fa-chalkboard-user"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Daftar Pengajar GO-LES</h2>
            <p class="text-xs text-slate-500">Bergabunglah sebagai tutor les privat dan bagikan ilmu terbaikmu</p>
        </div>

        <form id="form-register-tutor" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap & Gelar</label>
                <input type="text" id="reg-name" required placeholder="Contoh: Budi Santoso, S.Pd." class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
                <input type="email" id="reg-email" required placeholder="nama@email.com" class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran</label>
                    <select id="reg-subject" required class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50 font-medium">
                        <option value="Matematika">Matematika</option>
                        <option value="B. Indonesia">B. Indonesia</option>
                        <option value="B. Inggris">B. Inggris</option>
                        <option value="Fisika">Fisika</option>
                        <option value="Kimia">Kimia</option>
                        <option value="Biologi">Biologi</option>
                        <option value="Sosiologi">Sosiologi</option>
                        <option value="Sejarah">Sejarah</option>
                        <option value="Pancasila">Pancasila</option>
                        <option value="Geografi">Geografi</option>
                        <option value="Informatika">Informatika</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tingkat Kelas</label>
                    <select id="reg-level" required class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50 font-medium">
                        <option value="SD">SD</option>
                        <option value="SMP">SMP</option>
                        <option value="SMA">SMA</option>
                        <option value="Umum">Umum</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Kota / Domisili</label>
                    <input type="text" id="reg-location" required placeholder="Contoh: Surabaya" class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tarif / Jam (Rp)</label>
                    <input type="number" id="reg-price" required min="10000" placeholder="50000" class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nomor WhatsApp</label>
                <input type="tel" id="reg-phone" required placeholder="08123456789" class="w-full text-xs p-3 border border-slate-200 rounded-xl outline-none focus:border-sky-600 bg-slate-50">
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md shadow-sky-600/20">
                Daftar Sebagai Tutor
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
            Sudah memiliki akun? <a href="login.html" class="text-sky-600 font-bold hover:underline">Masuk disini</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('form-register-tutor').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = 'Memproses Pendaftaran...';
            btnSubmit.disabled = true;

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const subject = document.getElementById('reg-subject').value;
            const level = document.getElementById('reg-level').value;
            const location = document.getElementById('reg-location').value.trim();
            const price = parseInt(document.getElementById('reg-price').value) || 0;
            const phone = document.getElementById('reg-phone').value.trim();

            const { data: authData, error: authError } = await _supabase.auth.signUp({
                email: email,
                password: password
            });

            if (authError) {
                alert('Gagal mendaftarkan akun autentikasi: ' + authError.message);
                btnSubmit.innerText = 'Daftar Sebagai Tutor';
                btnSubmit.disabled = false;
                return;
            }

            if (authData.user) {
                const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0284c7&color=fff`;

                const { error: profileError } = await _supabase
                    .from('tutors')
                    .insert([{
                        user_id: authData.user.id,
                        name: name,
                        email: email,
                        role: 'tutor',
                        status: 'pending',
                        subject: subject,
                        level: level,
                        location: location,
                        price: price,
                        phone_number: phone,
                        avatar: avatarUrl,
                        is_offline_verified: false
                    }]);

                if (profileError) {
                    alert('Gagal menyimpan profil tutor: ' + profileError.message);
                    btnSubmit.innerText = 'Daftar Sebagai Tutor';
                    btnSubmit.disabled = false;
                } else {
                    alert('Pendaftaran tutor berhasil! Silakan masuk ke akun kamu.');
                    window.location.href = 'login.html';
                }
            }
        });
    </script>
</body>
</html>
