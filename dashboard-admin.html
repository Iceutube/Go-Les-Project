<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-rose-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold shadow-md shadow-rose-600/20">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-rose-600 text-xs font-semibold">Admin Panel</span></span>
            </div>
            <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </button>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Verifikasi Pemesanan Sesi Les</h1>
                <p class="text-xs text-slate-500 mt-0.5">Semua pemesanan yang menggantung lebih dari 10 menit akan terverifikasi otomatis oleh sistem.</p>
            </div>
            <button onclick="loadAdminBookings()" class="bg-sky-50 hover:bg-sky-100 text-sky-600 border border-sky-200 px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-rotate"></i> Refresh Data
            </button>
        </div>

        <div id="admin-bookings-container" class="space-y-4">
            <p class="text-center text-xs text-slate-400 py-8">Memuat data pemesanan...</p>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 GO-LES. Hak Cipta Dilindungi.
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAdminAuth();
            await loadAdminBookings();
            // Jalankan sistem auto-approve setiap 30 detik
            setInterval(loadAdminBookings, 30000);
        });

        // Security Guard: Hanya izinkan role Admin
        async function checkAdminAuth() {
            const { data: { user } } = await _supabase.auth.getUser();

            if (!user) {
                window.location.href = 'admin.html';
                return;
            }

            const { data: profile } = await _supabase
                .from('tutors')
                .select('role')
                .or(`user_id.eq.${user.id},email.eq.${user.email}`)
                .single();

            if (!profile || profile.role !== 'admin') {
                alert('Kamu tidak memiliki otoritas untuk mengakses Dashboard Admin!');
                window.location.href = 'admin.html';
            }
        }

        async function loadAdminBookings() {
            const container = document.getElementById('admin-bookings-container');
            
            // 1. Ambil data transaksi pemesanan dari Supabase
            const { data: bookings, error } = await _supabase
                .from('bookings')
                .select('*, tutors(name, subject, avatar)')
                .order('created_at', { ascending: false });

            if (error || !bookings || bookings.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Belum ada transaksi pemesanan siswa.</p>`;
                return;
            }

            // 2. Cek & Eksekusi Otomatis Auto-Approve 10 Menit
            const now = new Date();
            const autoApproveIds = [];

            bookings.forEach(b => {
                if (b.status === 'pending') {
                    const createdAt = new Date(b.created_at);
                    const minutesPassed = (now - createdAt) / (1000 * 60);
                    if (minutesPassed >= 10) {
                        autoApproveIds.push(b.id);
                        b.status = 'confirmed'; 
                        b.auto_verified = true;
                    }
                }
            });

            if (autoApproveIds.length > 0) {
                await _supabase
                    .from('bookings')
                    .update({ 
                        status: 'confirmed', 
                        auto_verified: true, 
                        verified_at: now.toISOString() 
                    })
                    .in('id', autoApproveIds);
            }

            // 3. Render Komponen Kartu Pemesanan
            container.innerHTML = '';
            bookings.forEach(b => {
                const createdAt = new Date(b.created_at);
                const minutesPassed = Math.floor((now - createdAt) / (1000 * 60));
                
                let statusBadge = '';
                let approveBtn = '';

                if (b.status === 'confirmed') {
                    const autoLabel = b.auto_verified ? ' (Auto 10 Menit)' : '';
                    statusBadge = `<span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase"><i class="fa-solid fa-check"></i> Terverifikasi${autoLabel}</span>`;
                } else {
                    const remainingMins = Math.max(0, 10 - minutesPassed);
                    statusBadge = `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase"><i class="fa-solid fa-clock"></i> Pending (Sisa Waktu Auto: ${remainingMins} mnt)</span>`;
                    approveBtn = `
                        <button onclick="approveBookingManual(${b.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition shadow-sm">
                            <i class="fa-solid fa-circle-check"></i> Verifikasi Sekarang
                        </button>`;
                }

                const tutorName = b.tutors ? b.tutors.name : 'Tutor GO-LES';
                const proofLink = b.payment_proof 
                    ? `<a href="${b.payment_proof}" target="_blank" class="text-xs text-sky-600 font-bold hover:underline"><i class="fa-solid fa-file-invoice-dollar"></i> Buka Bukti Bayar</a>`
                    : `<span class="text-xs text-slate-400">Tidak ada bukti bayar</span>`;

                let modeDetail = b.session_mode === 'online' 
                    ? '<span class="text-sky-600 font-bold"><i class="fa-solid fa-video"></i> Sesi Online</span>'
                    : `<span class="text-amber-700 font-bold"><i class="fa-solid fa-house-user"></i> Offline (${b.offline_location === 'rumah_siswa' ? 'Ke Rumah Siswa: ' + (b.student_address || '-') : 'Siswa Ke Rumah Tutor'})</span>`;

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-3 shadow-sm hover:border-slate-300 transition">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-slate-100 pb-3">
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">Siswa: ${b.student_name} <span class="text-slate-400 font-normal">(${b.student_phone})</span></h4>
                                <p class="text-xs text-slate-500 mt-0.5">Tutor Tujuan: <strong>${tutorName}</strong></p>
                            </div>
                            <div class="flex items-center gap-2">
                                ${statusBadge}
                                ${approveBtn}
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p><strong>Tanggal Sesi:</strong> ${b.booking_date}</p>
                            <p><strong>Jam Sesi:</strong> ${b.booking_time}</p>
                            <p><strong>Bukti Transfer:</strong> ${proofLink}</p>
                            <p class="sm:col-span-3"><strong>Mode Belajar:</strong> ${modeDetail}</p>
                        </div>
                    </div>
                `;
            });
        }

        async function approveBookingManual(bookingId) {
            const { error } = await _supabase
                .from('bookings')
                .update({ 
                    status: 'confirmed', 
                    verified_at: new Date().toISOString() 
                })
                .eq('id', bookingId);

            if (error) {
                alert('Gagal memverifikasi: ' + error.message);
            } else {
                alert('Pemesanan berhasil diverifikasi!');
                await loadAdminBookings();
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
