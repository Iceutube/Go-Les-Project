<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-600 font-normal text-sm">| Portal Admin</span></span>
            </div>
            <div class="flex items-center gap-4">
                <span id="admin-email" class="text-xs font-semibold text-slate-600">admin@goles.com</span>
                <button onclick="handleLogout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 px-3.5 py-2 rounded-xl text-xs font-bold transition border border-red-200">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Persetujuan & Verifikasi Tutor</h1>
                <p class="text-xs text-slate-500 mt-1">Kelola permohonan pendaftaran tutor baru dan verifikasi status kelas offline.</p>
            </div>
            <button onclick="loadAdminData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs font-semibold transition">
                <i class="fa-solid fa-rotate"></i> Refresh Data
            </button>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-bold border-b border-slate-200">
                            <th class="p-4">Tutor</th>
                            <th class="p-4">Mata Pelajaran</th>
                            <th class="p-4">Lokasi</th>
                            <th class="p-4">Video Demo</th>
                            <th class="p-4">Status Akun</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tutor-list" class="text-sm divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-400">Memuat data tutor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const { data: profile } = await _supabase
                .from('tutors')
                .select('role')
                .eq('user_id', user.id)
                .maybeSingle();

            if (!profile || profile.role !== 'admin') {
                alert('Akses ditolak! Halaman ini khusus Admin.');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('admin-email').innerText = user.email;
            await loadAdminData();
        });

        async function loadAdminData() {
            const tbody = document.getElementById('admin-tutor-list');
            const { data: tutors, error } = await _supabase
                .from('tutors')
                .select('*')
                .neq('role', 'admin')
                .order('id', { ascending: false });

            if (error || !tutors || tutors.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Belum ada pendaftaran tutor.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            tutors.forEach(t => {
                const statusBadge = t.status === 'approved' 
                    ? `<span class="bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-md text-xs font-bold">Disetujui</span>` 
                    : `<span class="bg-amber-50 text-amber-600 px-2.5 py-1 rounded-md text-xs font-bold">Menunggu</span>`;

                const videoBtn = t.teaching_video_url 
                    ? `<a href="${t.teaching_video_url}" target="_blank" class="text-sky-600 hover:underline text-xs"><i class="fa-solid fa-circle-play"></i> Tonton Video</a>` 
                    : `<span class="text-slate-400 text-xs">-</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 flex items-center gap-3">
                            <img src="${t.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(t.name)}" class="w-10 h-10 rounded-xl object-cover">
                            <div>
                                <p class="font-bold text-slate-900">${t.name}</p>
                                <p class="text-xs text-slate-500">${t.email || '-'}</p>
                            </div>
                        </td>
                        <td class="p-4 text-slate-700 font-medium">${t.subject} (${t.level})</td>
                        <td class="p-4 text-slate-600">${t.location || 'Online'}</td>
                        <td class="p-4">${videoBtn}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-center">
                            ${t.status === 'pending' ? `
                                <button onclick="updateStatus(${t.id}, 'approved')" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition mr-1">
                                    Setujui
                                </button>
                            ` : `
                                <button onclick="updateStatus(${t.id}, 'pending')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                                    Batalkan
                                </button>
                            `}
                        </td>
                    </tr>
                `;
            });
        }

        async function updateStatus(id, newStatus) {
            const { error } = await _supabase.from('tutors').update({ status: newStatus }).eq('id', id);
            if (!error) {
                alert(`Status tutor berhasil diperbarui menjadi: ${newStatus}`);
                await loadAdminData();
            } else {
                alert(`Gagal memperbarui status: ${error.message}`);
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            alert('Berhasil keluar!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
