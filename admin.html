<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 max-w-md w-full space-y-6 shadow-2xl relative overflow-hidden">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-sm">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Portal Admin GO-LES</h1>
            <p class="text-xs text-slate-500">Masuk menggunakan akun otorisasi Administrator</p>
        </div>

        <form id="form-login-admin" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Admin</label>
                <input type="email" id="admin-email" required placeholder="admin@goles.com" class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600 bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="admin-password" required placeholder="••••••••" class="w-full text-xs p-3.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600 bg-slate-50">
            </div>

            <button type="submit" id="btn-login-admin" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-rose-600/20">
                Masuk Dashboard Admin
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('form-login-admin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const btn = document.getElementById('btn-login-admin');

            btn.innerText = 'Memeriksa Hak Akses...';
            btn.disabled = true;

            // 1. Authenticate via Supabase Auth
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert('Gagal masuk: ' + error.message);
                btn.innerText = 'Masuk Dashboard Admin';
                btn.disabled = false;
                return;
            }

            // 2. Verifikasi Role di Database
            const { data: profile } = await _supabase
                .from('tutors')
                .select('role')
                .or(`user_id.eq.${data.user.id},email.eq.${data.user.email}`)
                .single();

            if (profile && profile.role === 'admin') {
                alert('Login Admin Berhasil!');
                window.location.href = 'dashboard-admin.html';
            } else {
                alert('Akses Ditolak! Akun ini bukan akun dengan hak akses Administrator.');
                await _supabase.auth.signOut();
                btn.innerText = 'Masuk Dashboard Admin';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
