<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-600 font-normal text-sm">| Portal Admin</span></span>
            </div>
            <div class="flex items-center gap-4">
                <span id="admin-email" class="text-xs font-semibold text-slate-600">admin@goles.com</span>
                <button onclick="handleLogout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 px-3.5 py-2 rounded-xl text-xs font-bold transition border border-red-200">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Persetujuan & Verifikasi Tutor</h1>
                <p class="text-xs text-slate-500 mt-1">Kelola permohonan tutor baru dan verifikasi kelayakan mode mengajar offline (face-to-face).</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                <div class="flex items-center border border-slate-300 rounded-xl px-3 py-2 bg-slate-50 focus-within:border-sky-500 text-xs">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 mr-2"></i>
                    <input type="text" id="admin-search" oninput="filterAdminTutors()" placeholder="Cari nama tutor..." class="bg-transparent outline-none w-full sm:w-48">
                </div>
                <select id="admin-status-filter" onchange="filterAdminTutors()" class="border border-slate-300 rounded-xl px-3 py-2 bg-slate-50 text-xs font-semibold outline-none">
                    <option value="all">Semua Status</option>
                    <option value="pending">Menunggu (Pending)</option>
                    <option value="approved">Disetujui (Approved)</option>
                </select>
                <button onclick="loadAdminData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-semibold transition shrink-0">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-bold border-b border-slate-200">
                            <th class="p-4">Tutor</th>
                            <th class="p-4">Mata Pelajaran</th>
                            <th class="p-4">Rating & Ulasan</th>
                            <th class="p-4">Mode Mengajar</th>
                            <th class="p-4">Status Akun</th>
                            <th class="p-4 text-center">Aksi Verifikasi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tutor-list" class="text-sm divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-400">Memuat data tutor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        let rawTutorList = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const { data: profile } = await _supabase
                .from('tutors')
                .select('role')
                .eq('user_id', user.id)
                .maybeSingle();

            if (!profile || profile.role !== 'admin') {
                alert('Akses ditolak! Halaman ini khusus Admin.');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('admin-email').innerText = user.email;
            await loadAdminData();
        });

        async function loadAdminData() {
            const { data: tutors, error } = await _supabase
                .from('tutors')
                .select('*')
                .neq('role', 'admin')
                .order('id', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            rawTutorList = tutors || [];
            filterAdminTutors();
        }

        function filterAdminTutors() {
            const tbody = document.getElementById('admin-tutor-list');
            const searchVal = document.getElementById('admin-search').value.toLowerCase().trim();
            const filterVal = document.getElementById('admin-status-filter').value;

            const filtered = rawTutorList.filter(t => {
                const matchesName = (t.name || '').toLowerCase().includes(searchVal);
                const matchesStatus = filterVal === 'all' || t.status === filterVal;
                return matchesName && matchesStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Tutor tidak ditemukan.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach(t => {
                const statusBadge = t.status === 'approved' 
                    ? `<span class="bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-md text-xs font-bold">Disetujui</span>` 
                    : `<span class="bg-amber-50 text-amber-600 px-2.5 py-1 rounded-md text-xs font-bold">Menunggu</span>`;

                const offlineBadge = t.is_offline_verified
                    ? `<span class="bg-sky-50 text-sky-600 px-2.5 py-1 rounded-md text-xs font-bold"><i class="fa-solid fa-house-user"></i> Online & Offline</span>`
                    : `<span class="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-md text-xs font-medium">Online Only</span>`;

                const ratingVal = t.rating || 'Baru';
                const totalReviews = t.total_reviews || 0;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 flex items-center gap-3">
                            <img src="${t.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(t.name)}" class="w-10 h-10 rounded-xl object-cover">
                            <div>
                                <p class="font-bold text-slate-900">${t.name}</p>
                                <p class="text-xs text-slate-500">${t.email || '-'}</p>
                            </div>
                        </td>
                        <td class="p-4 text-slate-700 font-medium">${t.subject} (${t.level || 'Umum'})</td>
                        <td class="p-4"><span class="font-bold text-amber-500 text-xs"><i class="fa-solid fa-star"></i> ${ratingVal} (${totalReviews} ulasan)</span></td>
                        <td class="p-4">${offlineBadge}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-center space-x-1">
                            ${!t.is_offline_verified ? `
                                <button onclick="verifyOffline(${t.id}, true)" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg transition" title="Setujui Mode Offline">
                                    <i class="fa-solid fa-circle-check"></i> Setujui Offline
                                </button>
                            ` : `
                                <button onclick="verifyOffline(${t.id}, false)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg transition" title="Cabut Akses Offline">
                                    Cabut Offline
                                </button>
                            `}
                        </td>
                    </tr>
                `;
            });
        }

        async function verifyOffline(tutorId, statusBool) {
            const { error } = await _supabase
                .from('tutors')
                .update({ 
                    is_offline_verified: statusBool,
                    type: statusBool ? 'Online & Offline' : 'Online'
                })
                .eq('id', tutorId);

            if (!error) {
                alert(statusBool ? 'Verifikasi mengajar Offline berhasil disetujui!' : 'Akses mengajar Offline telah dicabut.');
                await loadAdminData();
            } else {
                alert('Gagal memperbarui verifikasi: ' + error.message);
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            alert('Berhasil keluar!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
