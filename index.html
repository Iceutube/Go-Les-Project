<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO-LES | Platform Les Privat Terpercaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES</span>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <a href="login.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition">Masuk</a>
                <a href="register-siswa.html" class="bg-sky-50 text-sky-600 hover:bg-sky-100 border border-sky-200 px-3 py-2 rounded-xl text-xs font-bold transition">Daftar Siswa</a>
                <a href="register-tutor.html" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition">Daftar Tutor</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-8">
        <div class="bg-sky-600 text-white p-8 rounded-3xl shadow-xl flex flex-col md:flex-row gap-6 items-center justify-between">
            <div class="space-y-2">
                <h1 class="text-2xl md:text-3xl font-extrabold">Temukan Tutor Les Privat Terbaik</h1>
                <p class="text-sky-100 text-xs md:text-sm">Tingkatkan prestasi belajar bersama guru berpengalaman untuk semua mata pelajaran.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                <select id="filter-mapel" onchange="filterIndexTutors()" class="px-3 py-2.5 rounded-xl text-slate-800 text-xs font-semibold outline-none bg-white border border-slate-200">
                    <option value="all">Semua Mata Pelajaran</option>
                    <option value="B. Indonesia">B. Indonesia</option>
                    <option value="B. Inggris">B. Inggris</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Fisika">Fisika</option>
                    <option value="Kimia">Kimia</option>
                    <option value="Biologi">Biologi</option>
                    <option value="Sosiologi">Sosiologi</option>
                    <option value="Sejarah">Sejarah</option>
                    <option value="Pancasila">Pancasila</option>
                    <option value="Geografi">Geografi</option>
                    <option value="Informatika">Informatika</option>
                </select>

                <select id="filter-level" onchange="filterIndexTutors()" class="px-3 py-2.5 rounded-xl text-slate-800 text-xs font-semibold outline-none bg-white border border-slate-200">
                    <option value="all">Semua Tingkat Kelas</option>
                    <option value="SD">SD</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                    <option value="Umum">Umum</option>
                </select>

                <input type="text" id="filter-lokasi" onkeyup="filterIndexTutors()" placeholder="Cari lokasi/kota..." class="px-4 py-2.5 rounded-xl text-slate-800 text-xs outline-none w-full sm:w-48 bg-white">
            </div>
        </div>

        <section>
            <h2 class="font-bold text-slate-900 text-xl mb-6 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-400"></i> Katalog Tutor Terverifikasi
            </h2>
            <div id="index-tutor-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="col-span-full text-center text-slate-400 py-8">Memuat katalog tutor...</p>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 GO-LES. Hak Cipta Dilindungi.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        let rawApprovedTutors = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadIndexTutorData();
        });

        async function loadIndexTutorData() {
            const { data: tutors, error } = await _supabase
                .from('tutors')
                .select('*')
                .eq('status', 'approved')
                .eq('role', 'tutor')
                .order('id', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            rawApprovedTutors = tutors || [];
            filterIndexTutors();
        }

        function filterIndexTutors() {
    const selectedMapel = document.getElementById('filter-mapel').value;
    const selectedLevel = document.getElementById('filter-level').value;
    const locVal = document.getElementById('filter-lokasi').value.toLowerCase().trim();

    const filtered = rawApprovedTutors.filter(t => {
        const matchMapel = selectedMapel === 'all' || t.subject === selectedMapel;
        const tutorLevel = t.level || '';
        const matchLevel = selectedLevel === 'all' || tutorLevel.includes(selectedLevel);
        const matchLoc = (t.location || '').toLowerCase().includes(locVal);

        return matchMapel && matchLevel && matchLoc;
    });

    renderIndexTutors(filtered);
}


        function renderIndexTutors(list) {
            const grid = document.getElementById('index-tutor-grid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-8">Tidak ada tutor yang sesuai kriteria.</p>`;
                return;
            }

            list.forEach(t => {
                const modeBadge = t.is_offline_verified 
                    ? `<span class="bg-sky-50 text-sky-600 text-[10px] font-bold px-2 py-0.5 rounded"><i class="fa-solid fa-house-user"></i> Online & Offline</span>`
                    : `<span class="bg-slate-100 text-slate-500 text-[10px] font-medium px-2 py-0.5 rounded">Online Only</span>`;

                const ratingBadge = `<span class="font-bold text-amber-500 text-xs"><i class="fa-solid fa-star"></i> ${t.rating || 'Baru'} (${t.total_reviews || 0})</span>`;

                grid.innerHTML += `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition">
                        <div class="flex gap-4 items-start mb-3">
                            <img src="${t.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(t.name)}" class="w-14 h-14 rounded-xl object-cover border border-slate-200">
                            <div>
                                <h4 class="font-bold text-slate-900">${t.name}</h4>
                                <p class="text-xs text-slate-500">${t.subject} (${t.level || 'Umum'})</p>
                                <p class="text-xs text-sky-600 font-semibold mt-1"><i class="fa-solid fa-location-dot"></i> ${t.location || 'Online'}</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mb-4">
                            ${modeBadge}
                            ${ratingBadge}
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-100 pt-3">
                            <span class="font-bold text-sky-600 text-sm">Rp ${(t.price || 0).toLocaleString('id-ID')}/jam</span>
                            <a href="login.html" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
                                Pesan Sesi
                            </a>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
