<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Siswa - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">
    <a href="index.html" class="absolute top-6 left-6 flex items-center gap-2 text-slate-600 hover:text-sky-600 font-bold text-xs bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm transition">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
    <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-xl p-8 space-y-6">
        <div class="text-center">
            <div class="bg-sky-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold mx-auto mb-3 text-xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Daftar Akun Siswa</h1>
            <p class="text-xs text-slate-500 mt-1">Cari dan pesan guru les privat pilihanmu di GO-LES</p>
        </div>

        <form id="form-register-siswa" class="space-y-4">
            <div>
                <label class="block font-semibold text-xs text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" id="reg-name" required placeholder="Budi Santoso" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="block font-semibold text-xs text-slate-700 mb-1">Email</label>
                <input type="email" id="reg-email" required placeholder="siswa@gmail.com" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-sky-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-xs text-slate-700 mb-1">Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-slate-700 mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="reg-phone" required placeholder="081234567890" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-sky-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-xs text-slate-700 mb-1">Tingkat Sekolah</label>
                    <select id="reg-level" required class="w-full border border-slate-300 rounded-xl p-2.5 text-xs bg-white outline-none focus:border-sky-500">
                        <option value="SD">SD</option>
                        <option value="SMP">SMP</option>
                        <option value="SMA">SMA</option>
                        <option value="Umum">Umum</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-xs text-slate-700 mb-1">Kota / Domisili</label>
                    <input type="text" id="reg-location" required placeholder="Surabaya" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-sky-500">
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">
                Daftar Sebagai Siswa
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 space-y-2 pt-2 border-t border-slate-100">
            <p>Sudah punya akun? <a href="login.html" class="text-sky-600 font-bold hover:underline">Masuk disini</a></p>
            <p>Ingin mengajar? <a href="register-tutor.html" class="text-sky-600 font-bold hover:underline">Daftar sebagai Tutor</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('form-register-siswa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = 'Mendaftarkan...';
            btnSubmit.disabled = true;

            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value;
            const level = document.getElementById('reg-level').value;
            const location = document.getElementById('reg-location').value;

            const finalAvatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0284c7&color=fff`;

            let { data: authData, error: authError } = await _supabase.auth.signUp({
                email: email,
                password: password
            });

            if (authError && authError.message.includes('already registered')) {
                const { data: signInData, error: signInError } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                if (!signInError) {
                    authData = signInData;
                    authError = null;
                }
            }

            if (authError) {
                alert('Gagal pendaftaran: ' + authError.message);
                btnSubmit.innerText = 'Daftar Sebagai Siswa';
                btnSubmit.disabled = false;
                return;
            }

            if (authData.user) {
                const { error: profileError } = await _supabase.from('tutors').insert([{
                    user_id: authData.user.id,
                    name: name,
                    email: email,
                    role: 'siswa',
                    status: 'approved',
                    is_offline_verified: false,
                    subject: '-',
                    level: level,
                    type: 'Online',
                    location: location,
                    phone_number: phone,
                    price: 0,
                    avatar: finalAvatarUrl
                }]);

                if (!profileError) {
                    alert('Pendaftaran akun siswa berhasil! Silakan login untuk memilih tutor.');
                    window.location.href = 'login.html';
                } else {
                    alert('Gagal menyimpan profil: ' + profileError.message);
                    btnSubmit.innerText = 'Daftar Sebagai Siswa';
                    btnSubmit.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
