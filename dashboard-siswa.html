<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-600 text-xs font-semibold">Siswa</span></span>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <img id="student-avatar" src="https://ui-avatars.com/api/?name=Siswa" class="w-8 h-8 rounded-full object-cover border border-slate-200">
                    <span id="student-name" class="font-bold text-xs text-slate-800">Siswa</span>
                </div>
                <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-2 rounded-xl text-xs font-bold transition" title="Keluar">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-8">
        <div class="bg-sky-600 text-white p-8 rounded-3xl shadow-xl flex flex-col md:flex-row gap-6 items-center justify-between">
            <div class="space-y-2">
                <h1 class="text-2xl md:text-3xl font-extrabold">Cari & Pesan Tutor Privat</h1>
                <p class="text-sky-100 text-xs md:text-sm">Pilih guru les terbaik sesuai tingkat sekolah dan mata pelajaran pilihanmu.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                <select id="filter-mapel" onchange="filterStudentTutors()" class="px-3 py-2.5 rounded-xl text-slate-800 text-xs font-semibold outline-none bg-white border border-slate-200">
                    <option value="all">Semua Mata Pelajaran</option>
                    <option value="B. Indonesia">B. Indonesia</option>
                    <option value="B. Inggris">B. Inggris</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Fisika">Fisika</option>
                    <option value="Kimia">Kimia</option>
                    <option value="Biologi">Biologi</option>
                    <option value="Sosiologi">Sosiologi</option>
                    <option value="Sejarah">Sejarah</option>
                    <option value="Pancasila">Pancasila</option>
                    <option value="Geografi">Geografi</option>
                    <option value="Informatika">Informatika</option>
                </select>

                <select id="filter-level" onchange="filterStudentTutors()" class="px-3 py-2.5 rounded-xl text-slate-800 text-xs font-semibold outline-none bg-white border border-slate-200">
                    <option value="all">Semua Tingkat Kelas</option>
                    <option value="SD">SD</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                    <option value="Umum">Umum</option>
                </select>

                <input type="text" id="filter-lokasi" onkeyup="filterStudentTutors()" placeholder="Cari lokasi/kota..." class="px-4 py-2.5 rounded-xl text-slate-800 text-xs outline-none w-full sm:w-48 bg-white">
            </div>
        </div>

        <section>
            <h2 class="font-bold text-slate-900 text-xl mb-6 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-400"></i> Rekomendasi Tutor Terverifikasi
            </h2>
            <div id="student-tutor-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="col-span-full text-center text-slate-400 py-8">Memuat katalog tutor...</p>
            </div>
        </section>
    </main>

    <div id="chat-modal" class="fixed bottom-4 right-4 w-80 sm:w-96 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 hidden flex flex-col overflow-hidden h-[450px]">
        <div class="bg-sky-600 text-white p-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img id="chat-target-avatar" src="https://ui-avatars.com/api/?name=User" class="w-8 h-8 rounded-full border border-white/30 object-cover">
                <div>
                    <h4 id="chat-target-name" class="font-bold text-xs">Obrolan Tutor</h4>
                    <span class="text-[9px] text-sky-100 flex items-center gap-1"><i class="fa-solid fa-circle text-emerald-400 text-[6px]"></i> Online</span>
                </div>
            </div>
            <button onclick="closeChatModal()" class="text-white hover:text-sky-200 text-base px-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="chat-messages-box" class="flex-1 p-3 overflow-y-auto space-y-2.5 bg-slate-50 text-xs">
            <p class="text-center text-slate-400 py-4 text-[11px]">Memuat percakapan...</p>
        </div>

        <form id="chat-form" onsubmit="sendChatMessage(event)" class="p-2.5 bg-white border-t border-slate-200 flex gap-2">
            <input type="text" id="chat-input" required placeholder="Tulis pesan..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-sky-500">
            <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 GO-LES. Hak Cipta Dilindungi.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        let rawApprovedTutors = [];
        let currentStudent = null;
        let currentChatTargetUserId = null;
        let chatSubscription = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkStudentAuth();
            await loadStudentTutorData();
        });

        async function checkStudentAuth() {
            const { data: { user } } = await _supabase.auth.getUser();

            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            currentStudent = user;

            const { data: profile } = await _supabase
                .from('tutors')
                .select('*')
                .or(`user_id.eq.${user.id},email.eq.${user.email}`)
                .single();

            if (profile) {
                document.getElementById('student-name').innerText = profile.name;
                document.getElementById('student-avatar').src = profile.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.name)}`;
            } else {
                document.getElementById('student-name').innerText = user.email.split('@')[0];
            }
        }

        async function loadStudentTutorData() {
            const { data: tutors, error } = await _supabase
                .from('tutors')
                .select('*')
                .eq('status', 'approved')
                .eq('role', 'tutor')
                .order('id', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            rawApprovedTutors = tutors || [];
            filterStudentTutors();
        }

        function filterStudentTutors() {
            const selectedMapel = document.getElementById('filter-mapel').value;
            const selectedLevel = document.getElementById('filter-level').value;
            const locVal = document.getElementById('filter-lokasi').value.toLowerCase().trim();

            const filtered = rawApprovedTutors.filter(t => {
                const matchMapel = selectedMapel === 'all' || t.subject === selectedMapel;
                const matchLevel = selectedLevel === 'all' || t.level === selectedLevel;
                const matchLoc = (t.location || '').toLowerCase().includes(locVal);
                return matchMapel && matchLevel && matchLoc;
            });

            renderStudentTutors(filtered);
        }

        function renderStudentTutors(list) {
            const grid = document.getElementById('student-tutor-grid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-8">Tidak ada tutor yang sesuai kriteria.</p>`;
                return;
            }

            list.forEach(t => {
                const modeBadge = t.is_offline_verified 
                    ? `<span class="bg-sky-50 text-sky-600 text-[10px] font-bold px-2 py-0.5 rounded"><i class="fa-solid fa-house-user"></i> Online & Offline</span>`
                    : `<span class="bg-slate-100 text-slate-500 text-[10px] font-medium px-2 py-0.5 rounded">Online Only</span>`;

                const ratingBadge = `<span class="font-bold text-amber-500 text-xs"><i class="fa-solid fa-star"></i> ${t.rating || 'Baru'} (${t.total_reviews || 0})</span>`;

                grid.innerHTML += `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition">
                        <div class="flex gap-4 items-start mb-3">
                            <img src="${t.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(t.name)}" class="w-14 h-14 rounded-xl object-cover border border-slate-200">
                            <div>
                                <h4 class="font-bold text-slate-900">${t.name}</h4>
                                <p class="text-xs text-slate-500">${t.subject} (${t.level || 'Umum'})</p>
                                <p class="text-xs text-sky-600 font-semibold mt-1"><i class="fa-solid fa-location-dot"></i> ${t.location || 'Online'}</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mb-4">
                            ${modeBadge}
                            ${ratingBadge}
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-100 pt-3 gap-2">
                            <span class="font-bold text-sky-600 text-xs sm:text-sm">Rp ${(t.price || 0).toLocaleString('id-ID')}/jam</span>
                            <div class="flex gap-1.5">
                                <button onclick="openChatModal('${t.user_id}', '${t.name.replace(/'/g, "\\'")}', '${t.avatar || ''}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 text-xs font-bold px-2.5 py-2 rounded-lg transition">
                                    <i class="fa-solid fa-comments"></i> Chat
                                </button>
                                <button onclick="bookTutor(${t.id})" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
                                    Pesan
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function openChatModal(targetUserId, targetName, targetAvatar) {
            if (!targetUserId || targetUserId === 'null' || targetUserId === 'undefined') {
                alert('Tutor ini belum memiliki akun user_id aktif untuk menerima pesan.');
                return;
            }

            currentChatTargetUserId = targetUserId;
            document.getElementById('chat-target-name').innerText = targetName;
            document.getElementById('chat-target-avatar').src = targetAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(targetName)}`;
            document.getElementById('chat-modal').classList.remove('hidden');

            await loadChatHistory();
            listenToRealtimeChat();
        }

        function closeChatModal() {
            document.getElementById('chat-modal').classList.add('hidden');
            if (chatSubscription) _supabase.removeChannel(chatSubscription);
        }

        async function loadChatHistory() {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML = '';

            const { data: messages, error } = await _supabase
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentStudent.id},receiver_id.eq.${currentChatTargetUserId}),and(sender_id.eq.${currentChatTargetUserId},receiver_id.eq.${currentStudent.id})`)
                .order('created_at', { ascending: true });

            if (error) {
                box.innerHTML = `<p class="text-center text-rose-500 py-2">Gagal memuat pesan.</p>`;
                return;
            }

            if (!messages || messages.length === 0) {
                box.innerHTML = `<p class="text-center text-slate-400 py-4 text-[11px]">Belum ada pesan. Mulai sapa tutor ini!</p>`;
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.sender_id === currentStudent.id;
                box.innerHTML += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                        <div class="${isMe ? 'bg-sky-600 text-white' : 'bg-white border border-slate-200 text-slate-800'} px-3 py-2 rounded-2xl max-w-[80%] shadow-sm">
                            ${msg.message}
                        </div>
                        <span class="text-[9px] text-slate-400 mt-0.5 px-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                `;
            });

            box.scrollTop = box.scrollHeight;
        }

        async function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msgText = input.value.trim();
            if (!msgText) return;

            const { error } = await _supabase.from('messages').insert([{
                sender_id: currentStudent.id,
                receiver_id: currentChatTargetUserId,
                message: msgText
            }]);

            if (!error) {
                input.value = '';
                await loadChatHistory();
            } else {
                alert('Gagal mengirim pesan: ' + error.message);
            }
        }

        function listenToRealtimeChat() {
            chatSubscription = _supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    loadChatHistory();
                })
                .subscribe();
        }

        async function bookTutor(tutorId) {
            alert('Fitur pemesanan sesi sedang disiapkan. Kamu bisa menghubungi tutor terlebih dahulu via fitur Chat!');
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
