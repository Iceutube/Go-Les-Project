<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tutor - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- NAVBAR DASHBOARD -->
    <nav class="bg-slate-900 text-white border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-500 text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-400 font-normal text-sm">| Dashboard Tutor</span></span>
            </div>
            <div class="flex items-center gap-4">
                <span id="tutor-email-display" class="text-xs text-slate-300">Memuat profil...</span>
                <button id="btn-logout" class="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
        
        <!-- INFORMASI STATUS TUTOR -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Status Verifikasi</span>
                <div id="status-badge" class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full">
                    Sedang Ditinjau Admin
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Total Penyewa</span>
                <span class="text-2xl font-extrabold text-sky-600">0 Siswa</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Syarat Kelas Offline</span>
                <span class="text-sm font-semibold text-slate-700">0 / 10 Review (Min. 4.0 ★)</span>
            </div>
        </div>

        <!-- DAFTAR SISWA YANG MENYEWA -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-sky-600"></i> Sesi Mengajar Mendatang
                </h3>
            </div>
            <div id="booking-list" class="p-6 text-center text-slate-500 text-sm">
                Belum ada siswa yang menyewa jadwal mengajar kamu.
            </div>
        </section>

    </main>

    <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs border-t border-slate-800">
        <p>&copy; 2026 GO-LES Platform. Prototype All Rights Reserved.</p>
    </footer>

    <!-- SUPABASE SDK & LOGIKAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Cek Session User
            const { data: { user } } = await _supabase.auth.getUser();

            if (!user) {
                alert('Silakan login terlebih dahulu!');
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('tutor-email-display').innerText = user.email;

            // Ambil data tutor dari tabel Supabase
            const { data: tutorProfile, error } = await _supabase
                .from('tutors')
                .select('*')
                .eq('user_id', user.id)
                .single();

            if (tutorProfile) {
                const badge = document.getElementById('status-badge');
                if (tutorProfile.status === 'approved') {
                    badge.className = 'inline-block px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full';
                    badge.innerText = 'Tutor Disetujui (Online)';
                }
            }
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
