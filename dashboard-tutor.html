<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Tutor - GO-LES</title>
    <script src="https://cdn.tailwindcss.com?suppressWarning=true"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">
    <!-- Navigasi Atas -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-600 text-xs font-semibold">Portal Tutor</span></span>
            </div>
            <div class="flex items-center gap-3">
                <img id="tutor-avatar-display" src="https://ui-avatars.com/api/?name=Tutor" class="w-8 h-8 rounded-full border border-slate-200 object-cover">
                <span id="tutor-name-display" class="text-xs font-bold text-slate-700">Tutor</span>
                <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-2 rounded-xl text-xs font-bold transition" title="Keluar">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
                 
        <!-- Kartu Profil Tutor -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <img id="tutor-profile-img" src="https://ui-avatars.com/api/?name=Tutor" class="w-16 h-16 rounded-2xl object-cover border border-slate-200">
                <div>
                    <h1 id="tutor-profile-name" class="text-lg font-extrabold text-slate-900">Memuat Profil...</h1>
                    <p id="tutor-profile-subject" class="text-xs text-slate-500 font-medium">-</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="tutor-status-badge" class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full">Pending</span>
                        <span id="offline-eligible-badge" class="text-[10px] font-semibold text-slate-500"></span>
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
                <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl">
                    <span class="text-slate-400 block font-semibold">Tarif / Jam</span>
                    <span id="tutor-price-display" class="font-bold text-sky-600">Rp 0</span>
                </div>
                <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl">
                    <span class="text-slate-400 block font-semibold">Rating Performa</span>
                    <span id="stat-video-rating" class="font-bold text-amber-500">-</span>
                </div>
            </div>
        </div>

        <!-- Grid Video & Statistik -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Panel Kelola Video Mengajar -->
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                <div class="border-b border-slate-100 pb-3 flex justify-between items-center">
                    <h2 class="text-sm font-extrabold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-video text-sky-600"></i> Kelola Video Mengajar
                    </h2>
                </div>

                <!-- Form Tambah Video Baru -->
                <form id="form-add-video" onsubmit="addTutorVideo(event)" class="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-3">
                    <p class="text-xs font-bold text-slate-700">Unggah Video Baru</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" id="new-video-title" required placeholder="Judul Video (contoh: Pemahaman Dasar Kalkulus)" class="text-xs p-2.5 border border-slate-200 rounded-lg outline-none focus:border-sky-600 bg-white">
                        <input type="url" id="new-video-url" required placeholder="Link Video (YouTube / Google Drive)" class="text-xs p-2.5 border border-slate-200 rounded-lg outline-none focus:border-sky-600 bg-white">
                    </div>
                    <button type="submit" id="btn-add-video" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition">
                        <i class="fa-solid fa-plus"></i> Tambah Video
                    </button>
                </form>

                <!-- Daftar Video yang Sudah Ada -->
                <div id="tutor-video-list" class="space-y-2 pt-2">
                    <p class="text-center text-xs text-slate-400 py-4">Memuat daftar video...</p>
                </div>
            </div>

            <!-- Panel Ringkasan Statistik -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                <h2 class="text-sm font-extrabold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-sky-600"></i> Ringkasan Langganan
                </h2>
                <div id="video-stats-box" class="space-y-3 text-xs">
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <span class="text-slate-600 font-medium">Pelanggan Aktif</span>
                        <span id="stat-video-subscribers" class="font-extrabold text-slate-900 text-sm">0</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <span class="text-slate-600 font-medium">Total Ulasan Siswa</span>
                        <span id="stat-video-reviews" class="font-extrabold text-slate-900 text-sm">0</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 GO-LES Portal Tutor. Hak Cipta Dilindungi.
    </footer>

    <!-- Supabase JS & Config Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/video-subscription.js"></script>
    <script>
        let currentTutorProfile = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkTutorAuth();
        });

        async function checkTutorAuth() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Ambil profil tutor dari database
            const { data: profile } = await _supabase
                .from('tutors')
                .select('*')
                .or(`user_id.eq.${user.id},email.eq.${user.email}`)
                .single();

            // Verifikasi bahwa role memang benar-benar 'tutor'
            if (!profile || profile.role !== 'tutor') {
                alert('Akses Ditolak! Halaman ini khusus untuk Pengajar / Tutor.');
                window.location.href = 'login.html';
                return;
            }

            currentTutorProfile = profile;
            renderTutorDashboard(profile);
            
            // Muat data video dan statistik dari modul terpisah jika fungsi tersedia
            if (typeof loadTutorVideoList === 'function') {
                await loadTutorVideoList(profile.id);
            }
            if (typeof loadVideoSubscriptionStats === 'function') {
                await loadVideoSubscriptionStats(profile.id);
            }
        }

        function renderTutorDashboard(profile) {
            const avatarUrl = profile.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.name)}`;
            
            document.getElementById('tutor-name-display').innerText = profile.name || 'Tutor';
            document.getElementById('tutor-avatar-display').src = avatarUrl;
            document.getElementById('tutor-profile-img').src = avatarUrl;
            document.getElementById('tutor-profile-name').innerText = profile.name;
            document.getElementById('tutor-profile-subject').innerText = `${profile.subject || '-'} (${profile.level || 'Umum'})`;
            document.getElementById('tutor-price-display').innerText = `Rp ${(profile.price || 0).toLocaleString('id-ID')}`;

            const badge = document.getElementById('tutor-status-badge');
            if (profile.status === 'approved') {
                badge.className = 'bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full';
                badge.innerText = 'Disetujui Admin';
            } else if (profile.status === 'rejected') {
                badge.className = 'bg-rose-100 text-rose-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full';
                badge.innerText = 'Pendaftaran Ditolak';
            } else {
                badge.className = 'bg-amber-100 text-amber-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full';
                badge.innerText = 'Menunggu Verifikasi Admin';
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
