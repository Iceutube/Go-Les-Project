<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tutor - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-600 font-normal text-sm">| Area Tutor</span></span>
            </div>
            <div class="flex items-center gap-4">
                <span id="tutor-email" class="text-xs font-semibold text-slate-600">Tutor</span>
                <button onclick="handleLogout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 px-3.5 py-2 rounded-xl text-xs font-bold transition border border-red-200">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
            <div class="flex items-center gap-4">
                <img id="tutor-avatar" src="https://ui-avatars.com/api/?name=Tutor" class="w-16 h-16 rounded-2xl object-cover border border-slate-200">
                <div>
                    <h1 id="tutor-name" class="text-xl font-bold text-slate-900">Nama Tutor</h1>
                    <p id="tutor-subject" class="text-xs text-slate-500">Mata Pelajaran</p>
                    <span id="tutor-status-badge" class="inline-block mt-1 text-xs font-bold px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-600">Status...</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 block mb-1">Total Sesi Mengajar</span>
                <span id="total-sessions" class="text-2xl font-extrabold text-slate-900">0</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 block mb-1">Rating Rata-Rata</span>
                <span id="average-rating" class="text-2xl font-extrabold text-amber-500"><i class="fa-solid fa-star"></i> Baru</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 block mb-1">Verifikasi Offline</span>
                <span id="offline-status" class="text-2xl font-extrabold text-sky-600">Online Only</span>
            </div>
        </div>

        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-sky-600"></i> Jadwal Pemesanan & Ulasan Siswa
            </h3>
            <div id="booking-list" class="space-y-3">
                <p class="text-slate-400 text-sm text-center py-4">Belum ada siswa yang memesan sesi mengajar.</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('tutor-email').innerText = user.email;

            const { data: profile } = await _supabase
                .from('tutors')
                .select('*')
                .eq('user_id', user.id)
                .maybeSingle();

            if (profile) {
                document.getElementById('tutor-name').innerText = profile.name;
                document.getElementById('tutor-subject').innerText = `${profile.subject} (${profile.level || 'Umum'})`;
                document.getElementById('tutor-avatar').src = profile.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.name)}`;
                
                const badge = document.getElementById('tutor-status-badge');
                if (profile.status === 'approved') {
                    badge.className = 'inline-block mt-1 text-xs font-bold px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-600';
                    badge.innerText = 'Akun Disetujui (Aktif)';
                } else {
                    badge.className = 'inline-block mt-1 text-xs font-bold px-2.5 py-0.5 rounded-md bg-amber-50 text-amber-600';
                    badge.innerText = 'Menunggu Persetujuan Admin';
                }

                if (profile.is_offline_verified) {
                    document.getElementById('offline-status').innerText = 'Online & Offline';
                }

                await loadTutorBookings(profile.id);
            }
        });

        async function loadTutorBookings(tutorId) {
            const container = document.getElementById('booking-list');
            const { data: bookings } = await _supabase
                .from('bookings')
                .select('*')
                .eq('tutor_id', tutorId);

            if (!bookings || bookings.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm text-center py-4">Belum ada siswa yang memesan sesi mengajar.</p>`;
                return;
            }

            document.getElementById('total-sessions').innerText = bookings.length;
            
            let totalRating = 0;
            let ratingCount = 0;

            container.innerHTML = '';
            bookings.forEach(b => {
                if (b.rating) {
                    totalRating += b.rating;
                    ratingCount++;
                }

                const reviewText = b.review ? `"${b.review}"` : 'Belum memberikan ulasan';
                const ratingStars = b.rating ? `⭐ ${b.rating}.0` : 'Belum di-rating';

                container.innerHTML += `
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                        <div>
                            <span class="text-xs font-bold text-sky-600 block mb-1">ID Pesanan: #${b.id.substring(0, 8)}</span>
                            <p class="text-xs text-slate-600">Status Review: <span class="font-semibold text-slate-800">${reviewText}</span></p>
                        </div>
                        <span class="text-xs font-bold bg-amber-50 text-amber-600 px-2.5 py-1 rounded-lg">${ratingStars}</span>
                    </div>
                `;
            });

            if (ratingCount > 0) {
                const avg = (totalRating / ratingCount).toFixed(1);
                document.getElementById('average-rating').innerHTML = `<i class="fa-solid fa-star"></i> ${avg}`;
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            alert('Berhasil keluar!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
