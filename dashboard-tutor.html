<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tutor - GO-LES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-600 text-xs font-semibold">Tutor</span></span>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <img id="tutor-avatar" src="https://ui-avatars.com/api/?name=Tutor" class="w-8 h-8 rounded-full object-cover border border-slate-200">
                    <span id="tutor-name" class="font-bold text-xs text-slate-800">Tutor</span>
                </div>
                <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-2 rounded-xl text-xs font-bold transition" title="Keluar">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div id="status-alert" class="hidden p-4 rounded-2xl border text-xs font-semibold flex items-center gap-3">
            <i id="status-icon" class="fa-solid text-lg"></i>
            <div>
                <p id="status-title" class="font-bold"></p>
                <p id="status-desc" class="text-slate-500 font-normal mt-0.5"></p>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
            <div class="flex gap-4 items-center">
                <img id="card-avatar" src="https://ui-avatars.com/api/?name=Tutor" class="w-16 h-16 rounded-2xl object-cover border border-slate-200">
                <div>
                    <h2 id="card-name" class="text-lg font-bold text-slate-900">-</h2>
                    <p id="card-subject" class="text-xs text-sky-600 font-semibold">-</p>
                    <p id="card-location" class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-location-dot"></i> -</p>
                </div>
            </div>

            <div class="flex gap-4 border-t md:border-t-0 md:border-l border-slate-100 pt-4 md:pt-0 md:pl-6 w-full md:w-auto justify-between md:justify-start">
                <div>
                    <span class="text-[10px] text-slate-400 block font-semibold">Tarif Sesi</span>
                    <span id="card-price" class="text-sm font-extrabold text-slate-900">Rp 0/jam</span>
                </div>
                <div>
                    <span class="text-[10px] text-slate-400 block font-semibold">Status</span>
                    <span id="card-status-badge" class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500">Pending</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-sky-600"></i> Sesi Les Siswa
                </h3>
                <div id="booking-list" class="space-y-3">
                    <p class="text-center text-xs text-slate-400 py-6">Memuat sesi les...</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
                    <i class="fa-solid fa-comments text-emerald-600"></i> Pesan Masuk Siswa
                </h3>
                <div id="chat-inbox-list" class="space-y-2">
                    <p class="text-center text-xs text-slate-400 py-6">Memuat percakapan...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="chat-modal" class="fixed bottom-4 right-4 w-80 sm:w-96 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 hidden flex flex-col overflow-hidden h-[450px]">
        <div class="bg-sky-600 text-white p-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img id="chat-target-avatar" src="https://ui-avatars.com/api/?name=User" class="w-8 h-8 rounded-full border border-white/30 object-cover">
                <div>
                    <h4 id="chat-target-name" class="font-bold text-xs">Obrolan Siswa</h4>
                    <span class="text-[9px] text-sky-100 flex items-center gap-1"><i class="fa-solid fa-circle text-emerald-400 text-[6px]"></i> Online</span>
                </div>
            </div>
            <button onclick="closeChatModal()" class="text-white hover:text-sky-200 text-base px-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="chat-messages-box" class="flex-1 p-3 overflow-y-auto space-y-2.5 bg-slate-50 text-xs">
            <p class="text-center text-slate-400 py-4 text-[11px]">Memuat percakapan...</p>
        </div>

        <form id="chat-form" onsubmit="sendChatMessage(event)" class="p-2.5 bg-white border-t border-slate-200 flex gap-2">
            <input type="text" id="chat-input" required placeholder="Tulis balasan..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-sky-500">
            <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 GO-LES. Hak Cipta Dilindungi.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        let currentUser = null;
        let currentTutorProfile = null;
        let currentChatTargetUserId = null;
        let chatSubscription = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkTutorAuth();
        });

        async function checkTutorAuth() {
            const { data: { user } } = await _supabase.auth.getUser();

            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;

            const { data: profile, error } = await _supabase
                .from('tutors')
                .select('*')
                .eq('user_id', user.id)
                .eq('role', 'tutor')
                .single();

            if (error || !profile) {
                window.location.href = 'login.html';
                return;
            }

            currentTutorProfile = profile;
            renderTutorProfile(profile);
            await loadTutorBookings(profile.id);
            await loadChatInbox();
            listenToGlobalMessages();
        }

        function renderTutorProfile(p) {
            document.getElementById('tutor-name').innerText = p.name;
            document.getElementById('tutor-avatar').src = p.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}`;
            document.getElementById('card-avatar').src = p.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}`;
            document.getElementById('card-name').innerText = p.name;
            document.getElementById('card-subject').innerText = `${p.subject} (${p.level || 'Umum'})`;
            document.getElementById('card-location').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${p.location || 'Online'}`;
            document.getElementById('card-price').innerText = `Rp ${(p.price || 0).toLocaleString('id-ID')}/jam`;

            const alertBox = document.getElementById('status-alert');
            const alertIcon = document.getElementById('status-icon');
            const alertTitle = document.getElementById('status-title');
            const alertDesc = document.getElementById('status-desc');
            const statusBadge = document.getElementById('card-status-badge');

            alertBox.classList.remove('hidden');

            if (p.status === 'approved') {
                alertBox.className = 'p-4 rounded-2xl border text-xs font-semibold flex items-center gap-3 bg-emerald-50 border-emerald-200 text-emerald-800';
                alertIcon.className = 'fa-solid fa-circle-check text-emerald-600 text-lg';
                alertTitle.innerText = 'Akun Tutor Terverifikasi';
                alertDesc.innerText = 'Profil kamu sudah disetujui Admin dan sudah tampil di katalog utama.';
                statusBadge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700';
                statusBadge.innerText = 'Aktif / Approved';
            } else if (p.status === 'rejected') {
                alertBox.className = 'p-4 rounded-2xl border text-xs font-semibold flex items-center gap-3 bg-rose-50 border-rose-200 text-rose-800';
                alertIcon.className = 'fa-solid fa-circle-xmark text-rose-600 text-lg';
                alertTitle.innerText = 'Verifikasi Ditolak';
                alertDesc.innerText = 'Mohon periksa kembali data profil atau hubungi Admin GO-LES.';
                statusBadge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700';
                statusBadge.innerText = 'Ditolak';
            } else {
                alertBox.className = 'p-4 rounded-2xl border text-xs font-semibold flex items-center gap-3 bg-amber-50 border-amber-200 text-amber-800';
                alertIcon.className = 'fa-solid fa-clock text-amber-600 text-lg';
                alertTitle.innerText = 'Menunggu Verifikasi Admin';
                alertDesc.innerText = 'Tim Admin GO-LES sedang meninjau kelengkapan profil dan foto formal kamu.';
                statusBadge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700';
                statusBadge.innerText = 'Pending Review';
            }
        }

        async function loadTutorBookings(tutorId) {
            const list = document.getElementById('booking-list');

            const { data: bookings, error } = await _supabase
                .from('bookings')
                .select('*')
                .eq('tutor_id', tutorId)
                .order('created_at', { ascending: false });

            if (error || !bookings || bookings.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Belum ada pemesanan sesi les dari siswa.</p>`;
                return;
            }

            list.innerHTML = '';
            bookings.forEach(b => {
                list.innerHTML += `
                    <div class="border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row gap-3 justify-between items-start md:items-center hover:bg-slate-50 transition">
                        <div>
                            <h4 class="font-bold text-slate-900 text-xs">${b.student_name || 'Siswa GO-LES'}</h4>
                            <p class="text-[11px] text-slate-500 mt-0.5"><i class="fa-regular fa-clock"></i> ${b.booking_date || '-'} | ${b.booking_time || '-'}</p>
                            <p class="text-[11px] text-sky-600 font-medium mt-0.5"><i class="fa-brands fa-whatsapp"></i> ${b.student_phone || '-'}</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${b.status === 'confirmed' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${b.status || 'Pending'}
                        </span>
                    </div>
                `;
            });
        }

        async function loadChatInbox() {
            const inboxBox = document.getElementById('chat-inbox-list');

            const { data: messages, error } = await _supabase
                .from('messages')
                .select('*')
                .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
                .order('created_at', { ascending: false });

            if (error || !messages || messages.length === 0) {
                inboxBox.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Belum ada pesan dari siswa.</p>`;
                return;
            }

            const uniqueSenderIds = [...new Set(messages.map(m => m.sender_id === currentUser.id ? m.receiver_id : m.sender_id))];

            const { data: senders } = await _supabase
                .from('tutors')
                .select('*')
                .in('user_id', uniqueSenderIds);

            inboxBox.innerHTML = '';
            uniqueSenderIds.forEach(uid => {
                const senderProfile = (senders || []).find(s => s.user_id === uid) || { name: 'Siswa GO-LES', avatar: '' };
                const lastMsg = messages.find(m => m.sender_id === uid || m.receiver_id === uid);

                inboxBox.innerHTML += `
                    <div onclick="openChatModal('${uid}', '${senderProfile.name.replace(/'/g, "\\'")}', '${senderProfile.avatar || ''}')" class="p-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition cursor-pointer flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${senderProfile.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(senderProfile.name)}" class="w-9 h-9 rounded-full object-cover border border-slate-200">
                            <div>
                                <h4 class="font-bold text-xs text-slate-900">${senderProfile.name}</h4>
                                <p class="text-[11px] text-slate-500 truncate max-w-[160px]">${lastMsg ? lastMsg.message : ''}</p>
                            </div>
                        </div>
                        <span class="text-[9px] text-slate-400"><i class="fa-solid fa-chevron-right"></i></span>
                    </div>
                `;
            });
        }

        async function openChatModal(targetUserId, targetName, targetAvatar) {
            currentChatTargetUserId = targetUserId;
            document.getElementById('chat-target-name').innerText = targetName;
            document.getElementById('chat-target-avatar').src = targetAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(targetName)}`;
            document.getElementById('chat-modal').classList.remove('hidden');

            await loadChatHistory();
        }

        function closeChatModal() {
            document.getElementById('chat-modal').classList.add('hidden');
        }

        async function loadChatHistory() {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML = '';

            const { data: messages, error } = await _supabase
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatTargetUserId}),and(sender_id.eq.${currentChatTargetUserId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            if (error) {
                box.innerHTML = `<p class="text-center text-rose-500 py-2">Gagal memuat pesan.</p>`;
                return;
            }

            if (!messages || messages.length === 0) {
                box.innerHTML = `<p class="text-center text-slate-400 py-4 text-[11px]">Belum ada pesan.</p>`;
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.sender_id === currentUser.id;
                box.innerHTML += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                        <div class="${isMe ? 'bg-sky-600 text-white' : 'bg-white border border-slate-200 text-slate-800'} px-3 py-2 rounded-2xl max-w-[80%] shadow-sm">
                            ${msg.message}
                        </div>
                        <span class="text-[9px] text-slate-400 mt-0.5 px-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                `;
            });

            box.scrollTop = box.scrollHeight;
        }

        async function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msgText = input.value.trim();
            if (!msgText) return;

            const { error } = await _supabase.from('messages').insert([{
                sender_id: currentUser.id,
                receiver_id: currentChatTargetUserId,
                message: msgText
            }]);

            if (!error) {
                input.value = '';
                await loadChatHistory();
                await loadChatInbox();
            } else {
                alert('Gagal mengirim pesan: ' + error.message);
            }
        }

        function listenToGlobalMessages() {
            _supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if (currentChatTargetUserId && (payload.new.sender_id === currentChatTargetUserId || payload.new.receiver_id === currentChatTargetUserId)) {
                        loadChatHistory();
                    }
                    loadChatInbox();
                })
                .subscribe();
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
