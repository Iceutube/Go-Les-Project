<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pemesanan - GO-LES Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="dashboard-siswa.html" class="bg-sky-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-graduation-cap"></i>
                </a>
                <span class="font-extrabold text-lg tracking-tight">GO-LES <span class="text-sky-600 text-xs font-semibold">Riwayat Sesi</span></span>
            </div>
            <a href="dashboard-siswa.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Katalog
            </a>
        </div>
    </nav>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="border-b border-slate-200 pb-4">
            <h1 class="text-xl font-bold text-slate-900">Status Pemesanan & Sesi Les Saya</h1>
            <p class="text-xs text-slate-500 mt-1">Pantau proses verifikasi pembayaran dan jadwal belajar privatmu.</p>
        </div>

        <div id="student-history-list" class="space-y-4">
            <p class="text-center text-xs text-slate-400 py-8">Memuat riwayat pemesanan...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            await loadStudentBookings(user.id);
        });

        async function loadStudentBookings(studentId) {
            const container = document.getElementById('student-history-list');

            const { data: bookings, error } = await _supabase
                .from('bookings')
                .select('*, tutors(name, subject, avatar, phone_number)')
                .eq('student_id', studentId)
                .order('created_at', { ascending: false });

            if (error || !bookings || bookings.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Belum ada riwayat pemesanan sesi les.</p>`;
                return;
            }

            container.innerHTML = '';
            const now = new Date();

            bookings.forEach(b => {
                const createdAt = new Date(b.created_at);
                const minutesDiff = (now - createdAt) / (1000 * 60);

                // Cek batas 10 menit untuk auto-approve
                let statusBadge = '';
                if (b.status === 'confirmed' || minutesDiff >= 10) {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase"><i class="fa-solid fa-circle-check"></i> Terverifikasi</span>`;
                } else {
                    const remainingMins = Math.max(0, Math.ceil(10 - minutesDiff));
                    statusBadge = `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase"><i class="fa-solid fa-clock"></i> Menunggu Verifikasi Admin (${remainingMins}m)</span>`;
                }

                const tutorName = b.tutors ? b.tutors.name : 'Tutor GO-LES';
                const tutorSubject = b.tutors ? b.tutors.subject : '-';
                const tutorAvatar = b.tutors && b.tutors.avatar ? b.tutors.avatar : `https://ui-avatars.com/api/?name=${encodeURIComponent(tutorName)}`;

                let modeText = b.session_mode === 'online' 
                    ? 'Online (Tutor akan mengirim link via Chat)' 
                    : (b.offline_location === 'rumah_siswa' ? `Offline (Tutor ke Rumah Siswa: ${b.student_address})` : 'Offline (Siswa ke Rumah Tutor)');

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-3 shadow-sm">
                        <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                            <div class="flex items-center gap-3">
                                <img src="${tutorAvatar}" class="w-10 h-10 rounded-xl object-cover border border-slate-200">
                                <div>
                                    <h4 class="font-bold text-slate-900 text-sm">${tutorName}</h4>
                                    <p class="text-xs text-sky-600 font-semibold">${tutorSubject}</p>
                                </div>
                            </div>
                            ${statusBadge}
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 bg-slate-50 p-3 rounded-xl">
                            <p><strong>Tanggal Sesi:</strong> ${b.booking_date}</p>
                            <p><strong>Jam Sesi:</strong> ${b.booking_time}</p>
                            <p class="col-span-2"><strong>Mode Belajar:</strong> ${modeText}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
